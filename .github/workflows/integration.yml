name: Privileged OS integration
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    environment: platform-validation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: v2.16.0
          args: release --snapshot --clean
      - name: Reviewed disposable-runner OS lifecycle
        env:
          RAYMOND_PRIVILEGED_SMOKE: '1'
        run: scripts/smoke.sh
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raymond-acceptance-${{ runner.os }}-${{ github.run_attempt }}
          path: acceptance.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate archives
        if: runner.os == 'Linux' && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: raymond-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/metadata.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
