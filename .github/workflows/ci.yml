name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify embedded dashboard assets
        run: |
          npm ci --prefix web
          npm run check --prefix web
          npm run build --prefix web
          git diff --exit-code -- internal/proxy/web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: test -z "$(gofmt -l cmd internal test)"
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.0
      - run: go test ./...
      - run: go test -race ./...
      - run: make integration build
      - run: bash scripts/test-installer.sh
      - name: Static build matrix
        shell: bash
        run: |
          for os in darwin linux; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o bin/raymond_${os}_${arch} ./cmd/raymond
              test -s bin/raymond_${os}_${arch}
            done
          done
